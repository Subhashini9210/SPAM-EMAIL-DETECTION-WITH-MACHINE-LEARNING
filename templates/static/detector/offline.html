<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f35">
  <title>Offline | Spam Email Detector</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f5f7fb; color: #173f35; font: 16px/1.5 Arial, sans-serif; }
    main { width: min(100%, 460px); padding: 32px; box-sizing: border-box; border: 1px solid #d8e4dc; border-radius: 12px; background: white; }
    img { width: 56px; height: 56px; }
    h1 { margin: 20px 0 8px; font-size: 28px; }
    p { margin: 0; color: #596b63; }
  </style>
</head>
<body>
  <main>
    <img src="/static/detector/icon.svg" alt="">
    <h1>You’re offline</h1>
    <p>Reconnect to the internet to check an email message.</p>
  </main>
</body>
</html>
